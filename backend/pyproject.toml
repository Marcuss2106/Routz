[project]
name = "backend"
version = "0.1.0"
description = "User backend: simulated crossing alerts and ElevenLabs speech"
readme = "README.md"
authors = [
    { name = "Marcus Sostak", email = "marcuss2106@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
