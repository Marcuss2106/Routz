[project]
name = "backend"
version = "0.1.0"
description = "Railroad motion on port 8000 and the user voice API on port 8002"
readme = "README.md"
authors = [
    { name = "Marcus Sostak", email = "marcuss2106@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28.1",
    "pyproj>=3.6,<4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "shapely>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
backend = "backend.main:run"
user-backend = "backend.user_api:run"
fetch-rail-data = "backend.fetch_data:main"
fetch-road-data = "backend.fetch_roads:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
